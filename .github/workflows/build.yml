name: Build LaTeX document and release PDF
on: 
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Set up LaTeX
        run: |
          sudo apt-get update
          sudo apt -y install make texlive-full ttf-mscorefonts-installer
          sudo fc-cache -fv

      - name: Compile dissertation
        run: |
          cd ./Thesis
          make dissertation || { 
            echo "===== Last 200 lines of dissertation.log ====="
            tail -n 200 dissertation.log || true
            exit 1
          }

      - name: Move PDF
        run: mkdir -p github_artifacts && mv ./Thesis/dissertation.pdf ./github_artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dissertation.pdf
          path: ./github_artifacts

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: github_artifacts

      - name: move
        run: mkdir -p github_deploy && mv github_artifacts/*/* github_deploy

      - name: deploy on orphan branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true